[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reviews-semantics"
version = "0.1.0"
description = "Olist review-score classification service, built on dlkit."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "dlkit>=0.1.0,<0.2",
    "torch>=2.8,<3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "typer>=0.12",
]

[project.optional-dependencies]
train = [
    "dlkit[all]>=0.1.0,<0.2",
    "transformers>=5,<6",
    "optuna>=4",
    "mlflow>=2.11,<3",
    "rich>=13",
    "matplotlib>=3.8",
]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27"]
# Same self-referential pattern as dlkit's [all] - see
# _ignore/duvidas/03-extras-do-pip.md.
all = ["reviews-semantics[train,dev]"]

[project.scripts]
reviews-semantics = "reviews_semantics.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]
