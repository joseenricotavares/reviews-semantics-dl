name: Version check
description: Fails if a package's source changed without a version bump in its pyproject.toml.

inputs:
  package-name:
    description: Human-readable name of the package, used in log/error messages.
    required: true
  package-dir:
    description: Path to the package root (containing src/ and pyproject.toml).
    required: true
  base-sha:
    description: Git SHA to diff against (usually the PR base).
    required: true

runs:
  using: composite
  steps:
    - name: Check version bump
      shell: bash
      run: |
        set -euo pipefail
        NAME="${{ inputs.package-name }}"
        DIR="${{ inputs.package-dir }}"
        BASE="${{ inputs.base-sha }}"

        changed=$(git diff --name-only "$BASE"...HEAD -- "$DIR/src" "$DIR/pyproject.toml" | wc -l)
        if [ "$changed" -eq 0 ]; then
          echo "OK: $NAME - no source changes in this PR, no version bump required."
          exit 0
        fi

        version_line_changed=$(git diff "$BASE"...HEAD -- "$DIR/pyproject.toml" | grep -c '^[+-]version = ' || true)
        if [ "$version_line_changed" -eq 0 ]; then
          echo "::error::$NAME changed under $DIR/src (or $DIR/pyproject.toml) but the 'version' field in $DIR/pyproject.toml was not bumped. Bump it (patch/minor/major as appropriate) before merging."
          exit 1
        fi
        echo "OK: $NAME - source changed and version was bumped."
