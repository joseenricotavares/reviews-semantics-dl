name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  version-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ./.github/actions/version-check
        with:
          package-name: dlkit
          package-dir: src/dlkit
          base-sha: ${{ github.event.pull_request.base.sha }}

      - uses: ./.github/actions/version-check
        with:
          package-name: reviews_semantics
          package-dir: src/reviews_semantics
          base-sha: ${{ github.event.pull_request.base.sha }}

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install -e src/dlkit
          pip install -e "src/reviews_semantics[train]"
          pip install -r requirements-dev.txt

      - name: Lint
        run: |
          source .venv/bin/activate
          ruff check src

      - name: Test
        run: |
          source .venv/bin/activate
          pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build serve image
        run: docker build -f docker/serve.Dockerfile -t reviews-semantics-serve:ci .

      - name: Smoke test serve image
        run: |
          docker run -d --name serve-smoke -p 8000:8000 reviews-semantics-serve:ci
          for i in $(seq 1 20); do
            curl -sf http://localhost:8000/healthz && break
            sleep 2
          done
          curl -sf http://localhost:8000/readyz
          curl -sf -X POST http://localhost:8000/v1/predictions \
            -H "Content-Type: application/json" \
            -d '{"text": "produto otimo, chegou rapido"}'
          docker stop serve-smoke

      - name: Build train image
        run: docker build -f docker/train.Dockerfile -t reviews-semantics-train:ci .

  tag-release:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: [test, docker]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - uses: ./.github/actions/tag-package
        with:
          package-dir: src/dlkit

      - uses: ./.github/actions/tag-package
        with:
          package-dir: src/reviews_semantics
